name: Release

# Cut a release when a semver tag is pushed, e.g. `git tag v1.2.3 && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release + upload the tarball asset
  packages: write # push the container image to GHCR

jobs:
  # Native OTP release tarball (bundles ERTS) attached to a GitHub Release.
  tarball:
    name: tarball → GitHub Release
    runs-on: ubuntu-latest
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Versions match mise.toml ([tools]) exactly — keep them in sync.
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4.14"

      - name: Install dependencies
        run: mix deps.get --only prod

      - name: Build release
        env:
          BRIGADE_VERSION: ${{ steps.version.outputs.version }}
        run: mix release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: _build/prod/brigade-${{ steps.version.outputs.version }}.tar.gz
          # Tags like v1.2.3-rc1 / -beta are marked prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            OTP release tarball `brigade-${{ steps.version.outputs.version }}.tar.gz`
            bundles ERTS and was built on `ubuntu-latest` (glibc, linux/amd64).
            The target host must match that OS/arch. For other platforms, use the
            container image below.

            Container image:
            `docker pull ghcr.io/${{ github.repository_owner }}/brigade:${{ steps.version.outputs.version }}`

  # Container image pushed to GitHub Container Registry.
  image:
    name: image → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/brigade
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest only for stable (non-prerelease) tags.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BRIGADE_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
